<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hello We the Greeks!</title>
  <style>
    /* Simple, clean centering */
    html,body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(135deg, #ffffff 0%, #f0f8ff 100%);
      color: #0b3d91;
    }
    .wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    h1 {
      font-size: 2.5rem;
      letter-spacing: 0.02em;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Hello We the Greeks!</h1>
  </div>
</body>
</html>
